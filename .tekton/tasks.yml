apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  description: Remove temporary files from the source workspace.
  workspaces:
    - name: source
  steps:
    - name: cleanup
      image: alpine:3.20
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        echo "Starting cleanup..."
        mkdir -p temp
        rm -rf temp/*
        echo "Cleanup completed successfully."

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
spec:
  description: Execute Python unit tests using nose.
  workspaces:
    - name: source
  steps:
    - name: run-unit-tests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        echo "Installing dependencies..."
        pip install nose

        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi

        echo "Running unit tests..."
        nosetests tests/

        echo "All unit tests passed."